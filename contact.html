<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | SiteLaunch Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --navy: #0f2b4c;
        --blue: #1f5ea8;
        --white: #f8fbff;
        --text: #11253f;
        --muted: #5f728c;
        --border: #dfe9f4;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: var(--white);
        color: var(--text);
        line-height: 1.6;
      }

      .page-transition {
        opacity: 0;
        transform: translateY(12px);
        animation: pageFadeIn 0.45s ease forwards;
      }

      @keyframes pageFadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      a { color: inherit; text-decoration: none; }
      .container { width: min(900px, calc(100% - 2rem)); margin: 0 auto; }

      .side-nav {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 60;
      }

      .menu-toggle {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.3rem;
        width: 3rem;
        height: 3rem;
        border: 0;
        border-radius: 999px;
        background: var(--navy);
        color: white;
        box-shadow: 0 10px 20px rgba(15, 43, 76, 0.18);
        cursor: pointer;
        padding: 0.7rem;
      }

      .menu-toggle span {
        display: block;
        height: 2px;
        width: 100%;
        background: currentColor;
        border-radius: 999px;
      }

      .nav-panel {
        position: fixed;
        top: 0;
        left: -260px;
        width: 240px;
        height: 100vh;
        padding: 5rem 1.25rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        background: linear-gradient(180deg, var(--navy) 0%, #081c31 100%);
        color: white;
        box-shadow: 16px 0 40px rgba(8, 28, 49, 0.24);
        transition: left 0.25s ease;
        z-index: 55;
      }

      .side-nav.open .nav-panel {
        left: 0;
      }

      .nav-panel a {
        padding: 0.7rem 0.8rem;
        border-radius: 0.7rem;
        color: #e7f2ff;
        font-weight: 600;
      }

      .nav-panel a:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(8, 28, 49, 0.28);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 50;
      }

      .side-nav.open + .overlay {
        opacity: 1;
        pointer-events: auto;
      }

      body.nav-open {
        overflow: hidden;
      }

      .page {
        padding: 3rem 0;
      }

      .card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 10px 30px rgba(15, 43, 76, 0.06);
      }

      h1 {
        margin: 0 0 0.5rem;
        color: var(--navy);
      }

      .intro {
        margin: 0 0 1.2rem;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 0.9rem;
      }

      label {
        display: grid;
        gap: 0.35rem;
        font-weight: 600;
        color: var(--navy);
      }

      input, textarea {
        width: 100%;
        padding: 0.8rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 0.8rem;
        font: inherit;
        background: #fbfdff;
      }

      textarea { min-height: 140px; resize: vertical; }

      button {
        border: none;
        border-radius: 999px;
        padding: 0.9rem 1.2rem;
        background: var(--navy);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .note {
        margin-top: 0.8rem;
        font-size: 0.95rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="page-transition">
    <div class="side-nav" id="sideNav">
      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="navPanel" aria-label="Open navigation menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-panel" id="navPanel">
        <a href="index.html">Home</a>
        <a href="samples.html">View Our Work</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
    <div class="overlay" id="menuOverlay"></div>

    <main class="page">
      <div class="container">
        <div class="card">
          <h1>Contact Me</h1>
          <p class="intro">Fill out the form and it will be sent directly to the email address below.</p>

          <form id="contactForm" action="https://formsubmit.co/nandini.y0612@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="New website inquiry from SiteLaunch Digital" />
            <input type="hidden" name="_next" value="./thank-you.html" />
            <input type="hidden" name="_captcha" value="false" />

            <label>
              Name
              <input type="text" id="name" name="name" required />
            </label>
            <label>
              Email
              <input type="email" id="email" name="email" required />
            </label>
            <label>
              Message
              <textarea id="message" name="message" required></textarea>
            </label>
            <button type="submit">Send Message</button>
          </form>

          <p class="note">The form is now connected to email using FormSubmit. Replace <code>nandini.y0612@gmail.com</code> with your real address if needed.</p>
        </div>
      </div>
    </main>

    <script>
      const sideNav = document.getElementById("sideNav");
      const menuToggle = document.getElementById("menuToggle");
      const menuOverlay = document.getElementById("menuOverlay");
      const navPanel = document.getElementById("navPanel");

      const closeMenu = () => {
        sideNav.classList.remove("open");
        document.body.classList.remove("nav-open");
        menuToggle.setAttribute("aria-expanded", "false");
      };

      menuToggle.addEventListener("click", () => {
        const isOpen = sideNav.classList.toggle("open");
        document.body.classList.toggle("nav-open", isOpen);
        menuToggle.setAttribute("aria-expanded", String(isOpen));
      });

      menuOverlay.addEventListener("click", closeMenu);

      navPanel.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", closeMenu);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeMenu();
        }
      });
    </script>
    </div>
  </body>
</html>
